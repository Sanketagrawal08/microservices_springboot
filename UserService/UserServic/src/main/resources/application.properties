spring.application.name=UserService
spring.datasource.url=jdbc:mysql://localhost:3306/microservices
spring.datasource.username=root
spring.datasource.password=2005
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
server.port=8081
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.devtools.restart.enabled=true

eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

#spring.config.import=configserver:http://localhost:8086


# Actuator
management.health.circuitbreakers.enabled=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# Resilience4j
resilience4j.circuitbreaker.instances.ratingHotelBreaker.registerHealthIndicator=true
#yeh specific (ratinghotelcircuitbreaker) ko actuator ke saath register krega


resilience4j.circuitbreaker.instances.ratingHotelBreaker.eventConsumerBufferSize=10
#debugging m kaam ataa he last 10 events buffer me rakhega like state changed , open etcetra


resilience4j.circuitbreaker.instances.ratingHotelBreaker.failureRateThreshold=50
#50% failure rate hone pr circuit ko open krdo


resilience4j.circuitbreaker.instances.ratingHotelBreaker.minimumNumberOfCalls=5
#minimum 5 call honi chahiue tabhi failure rate calculate kro


resilience4j.circuitbreaker.instances.ratingHotelBreaker.automaticTransitionFromOpenToHalfOpenEnabled=true


resilience4j.circuitbreaker.instances.ratingHotelBreaker.waitDurationInOpenState=6s
#circuit open hone ke baad 6 second tak koi new request nahi jayegi then uske baad halp open me state change hogaa


resilience4j.circuitbreaker.instances.ratingHotelBreaker.permittedNumberOfCallsInHalfOpenState=3
#halfopen me 3 calls allowed hongi agar successfull rahengi toh state will change to closed


resilience4j.circuitbreaker.instances.ratingHotelBreaker.slidingWindowSize=10
#Circuit Breaker kitni recent requests ko observe kare? Har nayi request ke saath purani request window se bahar nikal jaati hai.


resilience4j.circuitbreaker.instances.ratingHotelBreaker.slidingWindowType=COUNT_BASED
#countbased means last 10 request par calculation hongi bhale wo 1 sec me aaye ya 1 ghante me
#time based me ustime pariod me jitni request aayengi usse calculate hoenga

